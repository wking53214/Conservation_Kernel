[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conservation-kernel"
version = "0.3.0"
description = "Independently testable hostile baseline that checks whether machine-mediated transformations preserve protected epistemic and provenance distinctions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional: lets the kernel's verdicts be expressed as CNS gate results. The
# kernel imports nothing from CNS unless conservation_kernel.cns_connector is
# used. Pinned to tag v1.4.0.
cns = [
    "cns @ git+https://github.com/wking53214/cns.git@3b465dbcc1a6a4ab6f1040f93d44483196abd737",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
